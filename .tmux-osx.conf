# macOS (iTerm2) overrides for tmux
#
# Pane switching via Cmd+I,J,K,L in iTerm2.
# iTerm2 translates Cmd key combos to Ctrl codes via hex:
#   Cmd+j → 0x0a → C-j
#   Cmd+l → 0x13 → C-s
#   Cmd+i → 0x11 → C-q
#   Cmd+k → 0x17 → C-w

bind -n C-j select-pane -L
bind -n C-s select-pane -R
bind -n C-q select-pane -U
bind -n C-w select-pane -D

bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
