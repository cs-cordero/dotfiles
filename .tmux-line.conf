# Tmux status line — ANSI-only colors
# Adapts to terminal color preset

set -g message-style fg=white,bg=black
set -g pane-active-border-style fg=green
set -g pane-border-style fg=white
set -g status-left-style none
set -g status-right-style none
set -g status-style bg=brightblue,fg=white
setw -g window-status-activity-style fg=green,bg=black,none
setw -g window-status-style fg=white,bg=black,none

set -g status "on"
set -g status-justify "centre"
set -g status-left "#[fg=white,bg=blue,bold] #(whoami) #[fg=default,bg=default,nobold]"
set -g status-left-length "100"
set -g status-right " %l:%M %p  %a %-e %b %Y #[fg=white,bg=green] #(cat ~/.machine-name 2>/dev/null || hostname -s) "
set -g status-right-length "100"
setw -g window-status-current-format ""
setw -g window-status-format ""
setw -g window-status-separator ""
