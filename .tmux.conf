# Tmux configurations
#
# These configurations set a number of options, the most important of which
# are key bindings.

unbind C-o

# allow resizing of panes
bind -n M-Left resize-pane -L
bind -n M-Right resize-pane -R
bind -n M-Up resize-pane -U
bind -n M-Down resize-pane -D

# make sure tmux has 256 colors
set -g default-terminal "tmux-256color"

# turn off annoying beeps
set -g bell-action none

#
# Pane switching — I,J,K,L (remapped arrow keys: i=up, j=left, k=down, l=right)
#
# We want the physical key in the "Cmd" position to switch panes:
#   - On macOS, that's the Cmd key
#   - On Linux, that's the Alt key
#
# Alt (M-) bindings work natively in any terminal, so these cover Linux
# and also work on macOS if you press Alt+I,J,K,L.
#
# Cmd is invisible to terminals — macOS intercepts it before it reaches
# the app. iTerm2 works around this by letting you map Cmd combos to hex
# codes (configured in keys.itermkeymap):
#   Cmd+j → 0x0a → C-j    Cmd+l → 0x13 → C-s
#   Cmd+i → 0x11 → C-q    Cmd+k → 0x17 → C-w
#
# The C- bindings below catch those translated codes. They're needed here
# (not just in .tmux-osx.conf) because when you SSH from iTerm2 into a
# remote machine, the hex codes travel through SSH and need to be bound
# in the *remote* tmux too.
#
# On Linux without iTerm2, nobody sends these Ctrl codes, so the C-
# bindings just sit unused. The tradeoff is that C-j (Enter), C-s (XOFF),
# C-q (XON), and C-w (delete word) lose their default terminal behavior
# inside tmux. In practice this rarely matters.
#
bind -n M-j select-pane -L
bind -n M-l select-pane -R
bind -n M-i select-pane -U
bind -n M-k select-pane -D
bind -n C-j select-pane -L
bind -n C-s select-pane -R
bind -n C-q select-pane -U
bind -n C-w select-pane -D

#
# Vi Copy Mode Settings
#
set-window-option -g mode-keys vi
bind -T copy-mode-vi i send -X cursor-up
bind -T copy-mode-vi j send -X cursor-left
bind -T copy-mode-vi k send -X cursor-down
bind -T copy-mode-vi l send -X cursor-right
bind -T copy-mode-vi I send -X page-up
bind -T copy-mode-vi K send -X page-down
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Clipboard — use OSC 52 so copy works everywhere (local, SSH, headless)
set -g set-clipboard on

#
# Alert Settings
#
set -g monitor-bell off

source-file ~/.tmux-line.conf
